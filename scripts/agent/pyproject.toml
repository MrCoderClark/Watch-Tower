[project]
name = "watchtower-agent"
version = "0.1.0"
description = "Watchtower host metrics agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "psutil>=6.0"]

[project.scripts]
watchtower-agent = "watchtower_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["watchtower_agent.py"]

[tool.hatch.build.targets.wheel.sources]
"watchtower_agent.py" = "watchtower_agent/__init__.py"
